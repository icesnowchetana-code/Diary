<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1c1c1a">
<title>每日日記（已停用）</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background: #f5f3ed;
    color: #1c1c1a;
    font: 400 19px/1.7 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  main { width: 100%; max-width: 520px; }
  h1 { margin: 0 0 12px; font-size: 30px; font-weight: 600; line-height: 1.35; }
  p { margin: 0 0 24px; color: #4a4843; }
  a.btn {
    display: block;
    margin-bottom: 14px;
    padding: 16px 20px;
    border-radius: 12px;
    background: #1c1c1a;
    color: #ffffff;
    font-size: 19px;
    text-decoration: none;
  }
  a.btn.alt { background: #ffffff; color: #1c1c1a; border: 1px solid #c9c4b8; }
  a.btn small { display: block; font-size: 15px; opacity: .8; }
  a.btn:focus-visible { outline: 3px solid #b08d57; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>這個日記 App 已經停用了</h1>
  <p>日記改寫在 Notion 的「2026日記」。每天晚上會自動開好當天那一頁，並連上當天的行程；每天的重點則在 Chetana Today 看。</p>
  <a class="btn" href="https://app.notion.com/p/371f4fedcfcc808784ede6946fb75fce">打開 2026日記<small>在 Notion 寫日記、放照片</small></a>
  <a class="btn alt" href="https://claude.ai/artifact/6f5ETdZzxzoSQWmuPCrXjD">打開 Chetana Today<small>今天的行程、日記、情報與 AI 辦公室</small></a>
</main>
<script>
  // 清掉舊版留在手機上的離線快取，之後都直接顯示這一頁。
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) { r.unregister(); });
    }).catch(function () {});
  }
  if (window.caches && caches.keys) {
    caches.keys().then(function (keys) {
      keys.forEach(function (k) { caches.delete(k); });
    }).catch(function () {});
  }
</script>
</body>
</html>
